<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Profil</title>
    <style>
        body {
            background-color: #f4f4f4;
            font-family: Arial, Sans-Serif;
        }
        
        .kartu {
            background-color: white;
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }
        
        .foto {
            border-radius: 50%;
            width: 100px;
        }
        
        .pekerjaan {
            color: gray;
            margin-top: -10px;
        }
        
        .btn-kontak {
            background: #041D56;
            color: #f5f5f5;
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="kartu">
        <img src="Photo-Profile.jpg" alt="Foto Profile" class="foto">
        <h2>Dhika Putra Pratama</h2>
        <p class="pekerjaan">Full-stack Developer</p>
        <p>Siswa XI RPL yang bercita-cita membuat startup teknologi di Indonesia.</p>
        <button class="btn-kontak">Kontak Saya</button>
    </div>
</body>
</html>
