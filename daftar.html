<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran Ekskul</title>
</head>
<body>
    <h2>Formulir Pendaftaran Ekskul RPL</h2>
    <label>Nama Lengkap:</label><br>
    <input type="text" name="nama_lengkap" id="" placeholder="Ketik namamu disini" required><br><br>
    <label>Tanggal Lahir:</label><br>
    <input type="date" name="tanggal_lahir" id="" required><br><br>
    <label>Nomor HP/WA:</label><br>
    <input type="number" name="nomor" id="" placeholder="Ketik nomor HP/WA disini" required/><br><br>
    <button type="submit">Daftar</button>
</body>
</html>
